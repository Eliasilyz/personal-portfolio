name: Update GitHub Stats

on:
  schedule:
    # every 8 hours — within 6-12h window, keeps data fresh without hitting rate limit
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/github-stats.json src/data/github-stats.json 2>/dev/null || git add public/data/github-stats.json
          if git diff --cached --quiet; then
            echo "No changes in github-stats.json"
            exit 0
          fi
          git commit -m "chore: update GitHub stats [skip ci]"
          git push
